name: Experimental Panther Lake Xe build
# V24 dispatches boot initialization to a dedicated kernel thread; periodic monitor status.
on:
  push:
    paths:
      - '.github/workflows/xe-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/xe-source-tars
          key: xe-pinned-source-tars-v1
      - name: Fetch source snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/src/xe-src" build
          fetch() {
            mkdir -p "$3" "$HOME/.cache/xe-source-tars"
            archive="$HOME/.cache/xe-source-tars/${1//\//_}-$2.tar.gz"
            if [ ! -s "$archive" ]; then
              if ! curl -fL --retry 3 --retry-delay 15 "https://codeload.github.com/$1/tar.gz/$2" -o "$archive.tmp"; then
                curl -fL --retry 4 --retry-delay 20 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/tarball/$2" -o "$archive.tmp"
              fi
              gzip -t "$archive.tmp"
              mv "$archive.tmp" "$archive"
            fi
            tar -xzf "$archive" --strip-components=1 -C "$3"
          }
          fetch InSnh-Gd/WTLIntelGfx 5ffc79fb9e53eb820899edd644b83681bea3aa39 "$GITHUB_WORKSPACE/build/WTLIntelGfx"
          fetch watchthelight-labs/WTLKcAbi 99808a2dcd645b971eaa19a65ca9e94682892ddb "$HOME/src/kcabi"
          fetch torvalds/linux 38fec10eb60d687e30c8c6b5420d86e8149f7557 "$HOME/src/xe-src/linux"
          fetch freebsd/drm-kmod c16de0f9fa "$HOME/src/xe-src/drm-kmod"
          fetch freebsd/freebsd-src 9da2c05a748fd17757638e1a9e78215cdb8b80d0 "$HOME/src/xe-src/freebsd"
          mkdir -p "$HOME/src/xe-src/linux-firmware/xe"
          cp third_party/linux-firmware/ptl_guc_70.bin "$HOME/src/xe-src/linux-firmware/xe/"
          cp third_party/linux-firmware/LICENSE.xe "$HOME/src/xe-src/linux-firmware/"
          echo 'ac42861c62b69f19923d9a69d971fb849921585a01924e14c0e8ac679d7cde81  third_party/linux-firmware/ptl_guc_70.bin' | shasum -a 256 -c -
          cp patches/xe-0208-guc-return-log.patch build/WTLIntelGfx/xkpi/xe/patches/0208-guc-return-log.patch
          cp patches/xe-0209-ggtt-checkpoints.patch build/WTLIntelGfx/xkpi/xe/patches/0209-ggtt-checkpoints.patch
          cp patches/xe-0218-lrc-ggtt-invalidate-isolate.patch build/WTLIntelGfx/xkpi/xe/patches/0218-lrc-ggtt-invalidate-isolate.patch
          cp patches/xe-0217-lrc-ggtt-clear-isolate.patch build/WTLIntelGfx/xkpi/xe/patches/0217-lrc-ggtt-clear-isolate.patch
          cp patches/xe-0216-lrc-ggtt-remove-isolate.patch build/WTLIntelGfx/xkpi/xe/patches/0216-lrc-ggtt-remove-isolate.patch
          cp patches/xe-0215-lrc-bo-put-isolate.patch build/WTLIntelGfx/xkpi/xe/patches/0215-lrc-bo-put-isolate.patch
          cp patches/xe-0214-lrc-put-isolate.patch build/WTLIntelGfx/xkpi/xe/patches/0214-lrc-put-isolate.patch
          cp patches/xe-0213-lrc-cleanup-isolate.patch build/WTLIntelGfx/xkpi/xe/patches/0213-lrc-cleanup-isolate.patch
          cp patches/xe-0212-cleanup-trace.patch build/WTLIntelGfx/xkpi/xe/patches/0212-cleanup-trace.patch
          cp patches/xe-0211-lrc-correlation.patch build/WTLIntelGfx/xkpi/xe/patches/0211-lrc-correlation.patch
          cp patches/xe-0210-ggtt-batch-drain.patch build/WTLIntelGfx/xkpi/xe/patches/0210-ggtt-batch-drain.patch
          cp patches/xe-0207-pc-start-control.patch build/WTLIntelGfx/xkpi/xe/patches/0207-pc-start-control.patch
          cp patches/xe-0206-pc-map-wait.patch build/WTLIntelGfx/xkpi/xe/patches/0206-pc-map-wait.patch
          cp patches/xe-0205-guc-error-propagation.patch build/WTLIntelGfx/xkpi/xe/patches/0205-guc-error-propagation.patch
          cp patches/xe-0204-pc-checkpoints.patch build/WTLIntelGfx/xkpi/xe/patches/0204-pc-checkpoints.patch
          cp patches/xe-0203-uc-checkpoints.patch build/WTLIntelGfx/xkpi/xe/patches/0203-uc-checkpoints.patch
          cp patches/xe-0202-gt-checkpoints.patch build/WTLIntelGfx/xkpi/xe/patches/0202-gt-checkpoints.patch
          cp patches/xe-0201-allocator-checkpoints.patch build/WTLIntelGfx/xkpi/xe/patches/0201-allocator-checkpoints.patch
          cp patches/xe-0200-gop-mmio-reservation.patch build/WTLIntelGfx/xkpi/xe/patches/0200-m1-gop-reservations.patch
          python3 patches/adapt_xe_mmio_reservation_tests.py build/WTLIntelGfx/harness/test_xe_stages.py
          cp patches/xe-0159-bsd-context.patch build/WTLIntelGfx/xkpi/xe/patches/0159-guc-fence-once.patch
          (cd build/WTLIntelGfx && patch -p1 -i "$GITHUB_WORKSPACE/patches/xe-ptl-dsm-mmio.patch")
          (cd build/WTLIntelGfx && patch -p1 -i "$GITHUB_WORKSPACE/patches/xe-ptl-metadata-only.patch")
          (cd build/WTLIntelGfx && python3 "$GITHUB_WORKSPACE/patches/test_ptl_metadata_guard.py" shim/src/xnu/xg_kext.cpp)
          (cd build/WTLIntelGfx && patch -p1 -i "$GITHUB_WORKSPACE/patches/xe-ptl-gop-snapshot.patch")
          (cd build/WTLIntelGfx && patch -p1 -i "$GITHUB_WORKSPACE/patches/xe-ptl-stage3-metadata.patch")
          (cd build/WTLIntelGfx && patch -p1 -i "$GITHUB_WORKSPACE/patches/xe-boot-personality.patch")
          python3 patches/instrument_sysinit.py build/WTLIntelGfx "$HOME/src/xe-src/freebsd"
          python3 patches/instrument_watchdog.py build/WTLIntelGfx
          python3 patches/instrument_boot_stage4.py build/WTLIntelGfx
          python3 patches/test_boot_stage4.py build/WTLIntelGfx/shim/src/xnu/xg_kext.cpp
          python3 patches/test_watchdog_heartbeat.py build/WTLIntelGfx/shim/src/xnu/xg_kext.cpp
          python3 patches/test_dpcpu_irq.py build/WTLIntelGfx/shim/src/fbsd/xg_kern.c --expect-regression
          (cd build/WTLIntelGfx && patch -p1 -i "$GITHUB_WORKSPACE/patches/xe-shim-dpcpu-irq.patch")
          python3 patches/test_dpcpu_irq.py build/WTLIntelGfx/shim/src/fbsd/xg_kern.c
      - name: Build and verify xe kernel driver
        shell: bash
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$SDKROOT/System/Library/Frameworks/Kernel.framework/Headers"
          test -r /System/Library/KernelCollections/BootKernelExtensions.kc
          cd build/WTLIntelGfx
          python3 "$GITHUB_WORKSPACE/patches/test_ptl_gop_snapshot.py" shim/src/xnu/xg_kext.cpp
          sed -i.bak "s/ptl-stage4-guc-v4/ptl-worker-heartbeat-v24/g" "$GITHUB_WORKSPACE/patches/test_ptl_stage3_policy.py"
          python3 "$GITHUB_WORKSPACE/patches/test_ptl_stage3_policy.py" shim/src/xnu/xg_kext.cpp
          XEGFX_KMD=xe bash build/build_xegfx.sh 2>&1 | tee "$GITHUB_WORKSPACE/build/xe-build.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('harness/test_xe_stages.py'); s=p.read_text()
          assert s.count('#define bzero(p,n)') == 1
          p.write_text(s.replace('#define bzero(p,n)', '#ifdef bzero\n#undef bzero\n#endif\n#define bzero(p,n)'))
          PY
          python3 harness/test_xe_stages.py 2>&1 | tee "$GITHUB_WORKSPACE/build/xe-tests.log"
          lipo out/XeGfx.kext/Contents/MacOS/XeGfx -verify_arch x86_64
          codesign --verify --verbose out/XeGfx.kext
          xcrun clang -arch x86_64 -mmacosx-version-min=15.0 -O2 -Wall -I"$HOME/src/xe-src/drm-kmod/include/uapi" -I"$HOME/src/xe-src/drm-kmod/include/uapi/drm" "$GITHUB_WORKSPACE/patches/xe_uapi_probe.c" -o out/xe-uapi-probe
          codesign -s - --force out/xe-uapi-probe
          lipo out/xe-uapi-probe -verify_arch x86_64
          python3 "$GITHUB_WORKSPACE/patches/test_allocator_checkpoints.py" out/xe-src/xe_ttm_vram_mgr.c
          python3 "$GITHUB_WORKSPACE/patches/test_guc_error_propagation.py" out/xe-src/xe_guc.c out/xe-src/xe_guc_pc.c
          python3 "$GITHUB_WORKSPACE/patches/test_ggtt_init_flow.py" out/xe-src/xe_ggtt.c
          python3 "$GITHUB_WORKSPACE/patches/test_ggtt_batch_drain.py" out/xe-src/xe_ggtt.c
          python3 "$GITHUB_WORKSPACE/patches/test_pc_map_wait.py" out/xe-src/xe_guc_pc.c
          python3 "$GITHUB_WORKSPACE/patches/test_pc_start_control.py" out/xe-src/xe_uc.c
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          k=Path('out/XeGfx.kext/Contents')
          blob=(k/'Resources/ptl_guc_70.bin').read_bytes()
          assert hashlib.sha256(blob).hexdigest()=='ac42861c62b69f19923d9a69d971fb849921585a01924e14c0e8ac679d7cde81'
          assert blob in (k/'MacOS/XeGfx').read_bytes()
          assert (k/'Resources/LICENSE.xe').stat().st_size > 1000
          print('Pinned PTL GuC resource, embedded image and licence verified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PantherLake-Xe-build-investigation
          path: |
            build/xe-build.log
            build/xe-tests.log
            build/WTLIntelGfx/out/*.txt
            build/WTLIntelGfx/out/*.json
            build/WTLIntelGfx/out/*.log
            build/WTLIntelGfx/out/link/ld.txt
            build/WTLIntelGfx/out/XeGfx.kext
            build/WTLIntelGfx/out/xe-uapi-probe
          retention-days: 14
